[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports/variables), I: import sorting,
# UP: modern Python syntax, B: likely bugs, SIM: simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables BEFORE importing the app (on purpose)
"tests/conftest.py" = ["E402"]